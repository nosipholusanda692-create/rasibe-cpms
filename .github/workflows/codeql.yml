name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC. The query pack ships new checks inside the action, so a
    # weekly run applies them to code that nobody has otherwise touched.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # The upload into the Security tab. This is the permission that fails on
      # a private repository without GitHub Code Security; the repository is
      # public, which is why this job exists now and not earlier.
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # JavaScript and TypeScript are analysed from source. There is no compile
      # step for CodeQL to watch: the API runs through tsx, and the client is a
      # Vite bundle. build-mode none is the mode GitHub documents for that.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # The default suite plus the lower-severity security queries.
          # security-and-quality was declined: its extra queries are about
          # maintainability, and a Security tab full of those trains everyone
          # to stop reading it.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
