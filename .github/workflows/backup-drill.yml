name: Backup drill

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backup-drill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rasibe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rasibe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # pg_dump refuses a server newer than itself, so the client is pinned to
      # the same major version as the service.
      - name: Install the PostgreSQL 16 client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16

      - name: Apply the schema and grant rasibe_app
        working-directory: db
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: rasibe
        run: |
          set -euo pipefail
          for f in 01_schema.sql 02_security.sql 03_triggers.sql 04_seed.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rasibe_app; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO rasibe_app; REVOKE UPDATE, DELETE ON audit_entry FROM rasibe_app;"

      - name: Encrypt the seeded restricted values
        working-directory: server
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: rasibe
          PGUSER: rasibe_app
          PGPASSWORD: rasibe_app_pw
          NODE_ENV: test
        run: npm run encrypt-existing

      - name: Back up, restore and verify
        working-directory: server
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: rasibe
          BACKUP_PGUSER: postgres
          BACKUP_PGPASSWORD: postgres
          NODE_ENV: test
        run: npm run test:backup
