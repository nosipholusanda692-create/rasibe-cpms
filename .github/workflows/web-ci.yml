name: Web CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # tsc -b && vite build. Until now this had only ever been run by hand, so
      # a change that broke the production build could reach main while the
      # server suite stayed green: nothing in CI compiled the front end at all.
      - name: Build
        working-directory: web
        run: npm run build
